<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3D4F"/>
      <stop offset="100%" stop-color="#1A3545"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="72" ry="72" fill="url(#bg)"/>

  <!-- === Upper section: D letter + magnifying glass === -->

  <!-- D vertical bar -->
  <rect x="95" y="55" width="130" height="210" rx="10" fill="#49BEBF"/>

  <!-- Magnifying glass lens - outer teal ring -->
  <circle cx="275" cy="145" r="95" fill="#49BEBF"/>

  <!-- White inner circle -->
  <circle cx="275" cy="145" r="74" fill="white"/>

  <!-- Gray ring -->
  <circle cx="275" cy="145" r="53" fill="#C8D2D7"/>

  <!-- White center -->
  <circle cx="275" cy="145" r="38" fill="white"/>

  <!-- Dark pupil -->
  <circle cx="275" cy="145" r="23" fill="#193241"/>

  <!-- Highlight dot -->
  <circle cx="267" cy="137" r="7" fill="white"/>

  <!-- Magnifying glass handle -->
  <rect x="340" y="210" width="38" height="100" rx="19" fill="#49BEBF" transform="rotate(-50, 340, 210)"/>

  <!-- === Lower section: CareFD text === -->

  <!-- CareFD text -->
  <text x="256" y="370" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="white" text-anchor="middle" letter-spacing="-1">CareFD</text>

  <!-- Small leaf on C -->
  <ellipse cx="147" cy="310" rx="8" ry="14" fill="#49BEBF" transform="rotate(-20, 147, 310)"/>

  <!-- Find Care Providers tagline -->
  <text x="256" y="405" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#C8D2D7" text-anchor="middle" letter-spacing="1">Find Care Providers</text>
</svg>
