<svg xmlns="http://www.w3.org/2000/svg" width="510" viewBox="0 0 510 140" height="140" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#29afb7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a8a90;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Icon: Medical cross + location pin -->
  <g transform="translate(15, 15)">
    <!-- Location pin shape -->
    <path d="M55,5 C35.1,5 19,21.1 19,41 C19,68.5 55,105 55,105 C55,105 91,68.5 91,41 C91,21.1 74.9,5 55,5 Z" fill="url(#tealGrad)" />
    <!-- Medical cross inside pin -->
    <rect x="47" y="24" width="16" height="36" rx="3" fill="white" />
    <rect x="37" y="34" width="36" height="16" rx="3" fill="white" />
  </g>
  <!-- Text: Care -->
  <text x="120" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#1e3a4f" letter-spacing="-1">Care</text>
  <!-- Text: Zone -->
  <text x="310" y="85" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="72" font-weight="700" fill="#29afb7" letter-spacing="-1">Zone</text>
  <!-- Tagline -->
  <text x="122" y="115" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="400" fill="#6b7d8e" letter-spacing="3">HealthCare Providers Zone</text>
</svg>
